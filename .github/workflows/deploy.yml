# Continuous delivery to Cloud Run. Keyless auth via Workload Identity Federation (no JSON keys).
# One-time setup: `terraform apply` in infra/terraform, then set repository variables
#   GCP_PROJECT, GCP_REGION, GCP_WIF_PROVIDER, GCP_DEPLOY_SA
name: deploy
on:
  push: { tags: ["v*"] }
  workflow_dispatch:
    inputs:
      traffic:
        description: "Percent of traffic for the new revision (canary)"
        default: "100"
concurrency: { group: deploy, cancel-in-progress: false }
permissions: { contents: read, id-token: write }

jobs:
  deploy:
    if: ${{ vars.GCP_PROJECT != '' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/verity/verity:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and push to Artifact Registry
        run: |
          gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet
          docker build --build-arg BUILD_SHA=${{ github.sha }} -t "$IMAGE" .
          docker push "$IMAGE"
      - name: Deploy new revision without traffic
        run: |
          gcloud run deploy verity-api --image "$IMAGE" --region ${{ vars.GCP_REGION }} \
            --project ${{ vars.GCP_PROJECT }} --no-traffic --tag "sha-${GITHUB_SHA::7}" \
            --update-env-vars BUILD_SHA=${{ github.sha }}
      - name: Smoke test the tagged revision (readiness + one offline-safe request)
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          TAG_URL=$(gcloud run services describe verity-api --region ${{ vars.GCP_REGION }}             --project ${{ vars.GCP_PROJECT }} --format json | jq -r --arg t "$TAG" '.status.traffic[] | select(.tag==$t) | .url')
          TOKEN=$(gcloud auth print-identity-token --impersonate-service-account ${{ vars.GCP_DEPLOY_SA }}             --audiences "$TAG_URL" --include-email)
          for i in $(seq 1 10); do curl -fsS -H "Authorization: Bearer $TOKEN" "$TAG_URL/readyz" && break; sleep 6; done
          curl -fsS -H "Authorization: Bearer $TOKEN" "$TAG_URL/version"
      - name: Shift traffic
        run: |
          gcloud run services update-traffic verity-api --region ${{ vars.GCP_REGION }} \
            --project ${{ vars.GCP_PROJECT }} --to-tags "sha-${GITHUB_SHA::7}=${{ inputs.traffic || '100' }}"
