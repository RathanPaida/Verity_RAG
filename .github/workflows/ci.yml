name: ci
on:
  push: { branches: [main] }
  pull_request:
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
permissions: { contents: read }

env:
  MONGODB_URI: "mongomock://"
  LLM_PROVIDER: fake
  EMBEDDING_PROVIDER: hash
  EMBEDDING_DIM: "256"
  CHECKPOINTER: memory
  EMBEDDING_CACHE_PATH: ""

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - name: ruff
        run: ruff check . --output-format=github
      - name: mypy
        run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: { python: ["3.10", "3.12"] }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "${{ matrix.python }}", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - name: Unit, end-to-end and API tests with coverage gate
        run: pytest --cov --cov-report=xml --cov-report=term
      - uses: actions/upload-artifact@v7
        if: matrix.python == '3.12'
        with: { name: coverage, path: coverage.xml }

  eval-gate:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - name: Retrieval + agent eval on the 54-question golden set (fails on regression vs eval/baseline.json)
        run: python -m eval.run_eval --ingest data/sample --agent --judge --gate --out eval-report.json
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: eval-report, path: eval-report.json }

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: Dependency vulnerability audit
        run: pip install pip-audit && pip-audit -r requirements.txt --progress-spinner off
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  container:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: verity:ci
          build-args: BUILD_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the container (offline mode)
        run: |
          docker run -d --name verity -p 8080:8080 -e MONGODB_URI=mongomock:// -e LLM_PROVIDER=fake \
            -e EMBEDDING_PROVIDER=hash -e EMBEDDING_DIM=256 -e CHECKPOINTER=memory -e AUTO_INGEST_SAMPLE=1 verity:ci
          for i in $(seq 1 30); do curl -fsS localhost:8080/readyz && break; sleep 2; done
          curl -fsS -X POST localhost:8080/ask -H 'content-type: application/json' \
            -d '{"engagement_id":"acme-payments","question":"What caused the ERR-4471 errors on PAY-API?"}' | head -c 400
          docker logs verity | tail -20

  terraform:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: infra/terraform } }
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
