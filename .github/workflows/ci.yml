name: ci
on: [push, pull_request]
jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: "mongomock://"
      LLM_PROVIDER: fake
      EMBEDDING_PROVIDER: hash
      EMBEDDING_DIM: "256"
      CHECKPOINTER: memory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Unit + end-to-end tests
        run: pytest -q
      - name: Retrieval & agent eval gate (fails on regression vs eval/baseline.json)
        run: python -m eval.run_eval --ingest data/sample --agent --judge --gate
