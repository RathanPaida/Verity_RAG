[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "verity"
version = "1.1.0"
description = "Evidence-grounded engineering due-diligence agents: LangGraph multi-agent RAG on MongoDB Atlas and Gemini."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Rathan Paida" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Framework :: FastAPI",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.9",
  "pydantic>=2.7,<3",
  "pymongo>=4.10,<5",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-mongodb>=0.4,<1",
  "google-genai>=2.33.0,<3",
  "pypdf>=5.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
gcp = ["google-cloud-storage>=3.17.1", "opentelemetry-sdk>=1.45.2", "opentelemetry-exporter-gcp-trace>=1.15.0"]
claude = ["anthropic[vertex]>=1.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "mongomock>=4.1", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11",
       "pre-commit>=3.7", "pip-audit>=2.7"]

[project.scripts]
verity-ingest = "scripts.ingest:main"
verity-eval = "eval.run_eval:main"

[tool.setuptools.packages.find]
include = ["verity*", "eval*", "scripts*"]

[tool.setuptools.package-data]
verity = ["api/static/*"]
eval = ["golden.jsonl", "baseline.json"]

# --------------------------------------------------------------------------- lint / format
[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".venv", "eval/results"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]
ignore = [
  "S101",   # assert is fine in tests and invariants
  "S311",   # random is not used for crypto
  "S603", "S607",  # subprocess in scripts with fixed args
  "B008",   # FastAPI Depends()/File() defaults are idiomatic
  "SIM108", # ternaries are not always clearer
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"eval/**" = ["S", "E501"]
"scripts/**" = ["S", "E501"]
"verity/agents/prompts.py" = ["E501"]  # prompt text, wrapped for the model not the linter

[tool.ruff.lint.isort]
known-first-party = ["verity", "eval", "scripts"]

# --------------------------------------------------------------------------- types
[tool.mypy]
python_version = "3.10"
packages = ["verity"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

# --------------------------------------------------------------------------- tests
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["verity", "eval"]
branch = true
omit = ["verity/llm/google_client.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 77
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:", "raise NotImplementedError"]
